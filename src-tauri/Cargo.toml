[package]
name = "biblehearth"
version = "0.1.0"
description = "A local-first desktop Bible reader"
authors = ["BibleHearth contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "biblehearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sentry = { version = "0.38", default-features = false, features = ["reqwest", "rustls"] }

[dev-dependencies]
tempfile = "3"
