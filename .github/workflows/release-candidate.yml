name: Build release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag, matching package and Tauri versions
        required: true
permissions:
  contents: write
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  build:
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg,app
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg,app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: bun install --frozen-lockfile
      - name: Validate candidate version and required configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_CONFIG: ${{ vars.TAURI_RELEASE_CONFIG }}
        run: node scripts/release-preflight.mjs
      - run: bun run typecheck
      - run: bun run test --run
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_YVP_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
          VITE_UPDATES_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: BibleHearth ${{ inputs.tag }}
          releaseBody: Release candidate. Not cleared for public use until every release gate passes.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release-config.json
